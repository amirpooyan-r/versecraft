[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "build_db"
version = "0.1.0"
description = "Build-time USFM to SQLite generator for VerseCraft"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
build-db = "build_db.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
